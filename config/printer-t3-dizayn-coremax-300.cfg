# Klipper configuration of the T3 Dizayn CoreMax 300, a CoreYX printer with a BTT SKR Pro v1.2 (STM32F407).
#
# This file holds every setting that is not tuned on the printer. It is included by the host's printer.cfg, which
# holds the host-specific settings and the values that SAVE_CONFIG writes. A tuned value must never be set here:
# SAVE_CONFIG refuses to save a value that an included file also sets.
#
# The MCU firmware is built with "make menuconfig" for the STM32F407 with a "32KiB bootloader", an 8 MHz crystal
# and USB on PA11/PA12. "make flash" does not work on the SKR Pro: copy out/klipper.bin as firmware.bin to an SD
# card and restart the board with it.
#
# Values come from the printer's Marlin configuration; settings it does not make are left at Klipper's defaults.
# Directions, endstops and the probe are expectations until checked with STEPPER_BUZZ, QUERY_ENDSTOPS and
# QUERY_PROBE.
#
# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PE9
dir_pin: PF1
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PB10
position_endstop: 0
position_max: 300
homing_speed: 50
homing_retract_dist: 5
second_homing_speed: 25

# Marlin's COREYX has the opposite sign on this motor from Klipper's corexy, and Marlin inverts its direction pin;
# the two cancel, so the pin is not inverted here.
[stepper_y]
step_pin: PE11
dir_pin: PE8
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PE12
position_endstop: 0
position_max: 300
homing_speed: 50
homing_retract_dist: 5
second_homing_speed: 25

[stepper_z]
step_pin: PE13
dir_pin: !PC2
enable_pin: !PC0
microsteps: 4
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_max: 300
homing_speed: 4
homing_retract_dist: 2
second_homing_speed: 1

[extruder]
step_pin: PE14
dir_pin: !PA0
enable_pin: !PC3
microsteps: 16
rotation_distance: 3.433
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200
max_extrude_only_velocity: 25
max_extrude_only_accel: 3000
min_extrude_temp: 170
heater_pin: PB1 # Heat0
sensor_pin: PF4 # T1 Header
sensor_type: PT1000
pullup_resistor: 4700
control: pid
max_power: 0.98
min_temp: 5
max_temp: 275

[heater_bed]
heater_pin: PD12
sensor_pin: PF3 # T0
sensor_type: EPCOS 100K B57560G104F
control: pid
min_temp: 5
max_temp: 150

# The two part-cooling fans, on FAN1 and FAN2, run together as the one fan that M106 sets.
[multi_pin part_cooling_fans]
pins: PE5, PE6

[fan]
pin: multi_pin:part_cooling_fans

# The hotend's own heatsink fan, on FAN0: it runs whenever the hotend is warm, whatever the print sets.
[heater_fan hotend_fan]
pin: PC8

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 1000
# Gives the same cornering as Marlin's junction deviation at the maximum acceleration.
square_corner_velocity: 9.7

[gcode_arcs]


########################################
# TMC driver configuration
########################################

# The stealthChop thresholds are Marlin's hybrid thresholds: stealthChop below, spreadCycle above.

[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.800
stealthchop_threshold: 100

[tmc2209 stepper_y]
uart_pin: PE3
run_current: 0.800
stealthchop_threshold: 100

# The sense resistor is the module's own, not the TMC2209's: verify it on the module before the first power-on. A
# value set below the real one gives the motor less current than run_current, never more.
[tmc5160 stepper_z]
cs_pin: PB9
spi_bus: spi3a
sense_resistor: 0.075
run_current: 2.000
stealthchop_threshold: 3

[tmc2209 extruder]
uart_pin: PD4
run_current: 0.800
stealthchop_threshold: 30


########################################
# Probe, homing and bed levelling
########################################

# A fixed probe beside the nozzle, on the Z min socket.
[probe]
pin: ^!PG8
x_offset: -43
y_offset: -4
speed: 4

# Homes Z with the probe over the bed centre; the position is the nozzle's, so it includes the probe offset.
[safe_z_home]
home_xy_position: 193, 154

# The mesh limits are probe positions: as far as the probe reaches, 10 mm from the bed's edges.
[bed_mesh]
speed: 133
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 257, 290
probe_count: 3, 3

# The positions put the probe over each bed screw: the nozzle's position, so they include the probe offset.
[screws_tilt_adjust]
screw1: 93, 54
screw2: 293, 54
screw3: 293, 254
screw4: 93, 254
screw_thread: CW-M4

# Heats the hotend and the bed before probing, as Marlin does, so the mesh is measured at a warm bed.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
gcode:
    M140 S50
    M104 S120
    M190 S50
    M109 S120
    _BED_MESH_CALIBRATE_BASE {rawparams}


########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PG4, EXP1_3=PD11, EXP1_5=PG2, EXP1_7=PG6, EXP1_9=<GND>,
    EXP1_2=PA8, EXP1_4=PD10, EXP1_6=PG3, EXP1_8=PG7, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PG10, EXP2_5=PF11, EXP2_7=PF12,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PB12, EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=PF13
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "spi2"
